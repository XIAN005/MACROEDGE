<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MacroEdge Desk</title>
<style>
:root{--bg:#0f1420;--card:#171e2e;--bd:#27314a;--tx:#e6eaf4;--mu:#8b97b3;--ac:#4f8cff;--up:#22c58b;--dn:#ef5b5b;--wa:#f0a030}
:root[data-theme=light]{--bg:#f3f5fa;--card:#fff;--bd:#d8deeb;--tx:#1a2236;--mu:#5d6985;--ac:#2563eb;--up:#0f9d6b;--dn:#d63b3b;--wa:#c57a0a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
#top{position:sticky;top:0;z-index:20;min-height:52px;background:var(--card);border-bottom:1px solid var(--bd);display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 12px}
#top h1{font-size:16px;margin:0 8px 0 0}
.tabs{display:flex;flex-wrap:wrap;gap:4px;flex:1}
.tabs button,.btn{background:transparent;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
.tabs button.on,.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
main{padding:12px;max-width:1300px;margin:auto}
section.tab{display:none}section.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.tbl{width:100%;border-collapse:collapse}.tbl th,.tbl td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.scroll{overflow-x:auto;max-width:100%}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--bd);color:var(--mu);margin-left:4px}
.badge.stale{color:var(--wa);border-color:var(--wa)}.badge.na{color:var(--dn);border-color:var(--dn)}
.up{color:var(--up)}.dn{color:var(--dn)}.mu{color:var(--mu)}
input,select,textarea{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;font:inherit;max-width:100%}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--ac)}
#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:6px}
#toast div{background:var(--card);border:1px solid var(--wa);padding:8px 14px;border-radius:8px}
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:40;padding:12px}
#modal.on{display:flex}#modal .box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;max-width:640px;width:100%;max-height:85vh;overflow:auto}
.warn{font-size:12px;color:var(--mu);margin:8px 0}
@media(max-width:600px){main{padding:8px}.tabs button{padding:5px 8px}}
</style>
</head>
<body>
<header id="top">
  <h1>MacroEdge Desk</h1>
  <nav class="tabs" id="tabs">
    <button data-tab="dashboard" class="on">Dashboard</button><button data-tab="deep">Analyse approfondie</button>
    <button data-tab="news">News</button><button data-tab="gen">Générateur</button>
    <button data-tab="journal">Journal</button><button data-tab="settings">Réglages</button>
  </nav>
  <button class="btn" id="themeBtn" title="Thème">◐</button>
</header>
<main>
  <div class="warn" id="disclaimer">Aide à l'analyse, pas un conseil en investissement. Les scores sont un modèle heuristique.</div>
  <section class="tab on" id="tab-dashboard"><div id="dash"></div></section>
  <section class="tab" id="tab-deep"><div id="deepView"></div></section>
  <section class="tab" id="tab-news"><div id="newsView"></div></section>
  <section class="tab" id="tab-gen"><div id="genView"></div></section>
  <section class="tab" id="tab-journal"><div id="journalView"></div></section>
  <section class="tab" id="tab-settings"><div id="settingsView"></div></section>
</main>
<div id="toast"></div>
<div id="modal"><div class="box" id="modalBox"></div></div>

<script>
'use strict';
/* ================= PARTIE 1/4 : SOCLE ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = u => /^https:\/\//i.test(u || '') ? esc(u) : '';
const fmtTime = iso => { const d = new Date(iso); return isNaN(d) ? '—' : d.toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); };
const ageMin = iso => Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 6e4));
const ageTxt = m => m < 60 ? m + ' min' : m < 2880 ? Math.round(m / 60) + ' h' : Math.round(m / 1440) + ' j';
const utcDay = () => new Date().toISOString().slice(0, 10);
const toNum = v => { if (typeof v === 'number') return v; const n = parseFloat(String(v ?? '').trim().replace(/\s/g, '').replace(',', '.')); return isNaN(n) ? null : n; };

function toast(msg, ms = 5000) { const d = document.createElement('div'); d.textContent = msg; $('#toast').append(d); setTimeout(() => d.remove(), ms); }
function openModal(html) { $('#modalBox').innerHTML = html; $('#modal').classList.add('on'); }
function closeModal() { $('#modal').classList.remove('on'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('Copié.'); }
  catch { openModal(`<p>Presse-papiers indisponible : copie manuellement.</p><textarea style="width:100%;height:260px" readonly>${esc(t)}</textarea>`); }
}

/* ---- stockage : localStorage, sinon mémoire de session + avertissement ---- */
const MEM = {}; let storageWarned = false;
const store = {
  get(k, d) { try { const v = localStorage.getItem('me_' + k); if (v != null) return JSON.parse(v); } catch {} return k in MEM ? MEM[k] : d; },
  set(k, v) { MEM[k] = v; try { localStorage.setItem('me_' + k, JSON.stringify(v)); } catch { if (!storageWarned) { storageWarned = true; toast('Stockage local plein ou bloqué : données gardées en mémoire pour cette session seulement.'); } } },
  del(k) { delete MEM[k]; try { localStorage.removeItem('me_' + k); } catch {} },
  clearAll() { Object.keys(MEM).forEach(k => delete MEM[k]); try { Object.keys(localStorage).filter(k => k.startsWith('me_')).forEach(k => localStorage.removeItem(k)); } catch {} }
};

/* ---- réglages ---- */
const PAIRS = ['EUR/USD', 'GBP/USD', 'USD/JPY', 'USD/CHF', 'AUD/USD', 'USD/CAD', 'NZD/USD', 'XAU/USD'];
const DEFAULTS = {
  keys: { gemini: '', gemini2: '', twelvedata: '', alphavantage: '', finnhub: '' },
  model: 'gemini-2.5-flash', relays: [], primary: 'auto',
  order: { history: ['twelvedata', 'alphavantage', 'frankfurter', 'stooq'], calendar: ['finnhub', 'forexfactory'], news: ['finnhub', 'rss', 'alphavantage'] },
  disabled: {}, active: Object.fromEntries(PAIRS.map(p => [p, true])),
  weights: { policy: 30, momentum: 30, structure: 15, risk: 10, news: 15 },
  rates: {}, demo: false, avNews: false, theme: 'dark'
};
function getSettings() { const s = store.get('settings', {}); return { ...DEFAULTS, ...s, keys: { ...DEFAULTS.keys, ...s.keys }, order: { ...DEFAULTS.order, ...s.order }, weights: { ...DEFAULTS.weights, ...s.weights }, active: { ...DEFAULTS.active, ...s.active } }; }
function saveSettings(s) { store.set('settings', s); }
function applyTheme() { document.documentElement.dataset.theme = getSettings().theme; }
$('#themeBtn').onclick = () => { const s = getSettings(); s.theme = s.theme === 'dark' ? 'light' : 'dark'; saveSettings(s); applyTheme(); };
applyTheme();

/* ---- relais : URL normalisée, liste avec bascule, erreurs explicites ---- */
function normRelay(u) {
  u = (u || '').trim(); if (!u) return '';
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  u = u.replace(/\/+$/, '');
  return /\/api\/analyze$/.test(u) ? u : u + '/api/analyze';
}
function relayList() {
  const s = getSettings(); let l = s.relays.map(normRelay).filter(Boolean);
  if (!l.length && /\.vercel\.app$/.test(location.hostname)) l = [location.origin + '/api/analyze']; // pré-rempli seulement sur *.vercel.app
  return l;
}
async function relayOne(url, action, params, body, keys) {
  const qs = new URLSearchParams({ action, ...params }).toString();
  const headers = {}; if (keys) for (const [k, v] of Object.entries(keys)) if (v && k !== 'gemini2') headers['x-' + k + '-key'] = v;
  const ac = new AbortController(), t = setTimeout(() => ac.abort(), 33000);
  let r, tx;
  try {
    r = await fetch(url + '?' + qs, body ? { method: 'POST', headers: { ...headers, 'Content-Type': 'application/json' }, body: JSON.stringify(body), signal: ac.signal } : { headers, signal: ac.signal });
    tx = await r.text();
  } catch (e) { throw Object.assign(new Error(e.name === 'AbortError' ? 'Le relais ne répond pas (timeout).' : 'Relais injoignable (réseau ou CORS).'), { unreachable: true }); }
  finally { clearTimeout(t); }
  let j; try { j = JSON.parse(tx); } catch {
    throw Object.assign(new Error(/^\s*</.test(tx) ? `Le relais a renvoyé une page HTML (HTTP ${r.status}) : vérifie l'URL et que /api/analyze est déployé.` : `Le relais a renvoyé une réponse non-JSON (HTTP ${r.status}).`), { unreachable: true });
  }
  if (j && j.error && !r.ok) throw Object.assign(new Error(j.error), { source: j.source, attempts: j.attempts, tried: j.tried, status: r.status });
  return j;
}
async function relay(action, params = {}, body = null) {
  const s = getSettings(), urls = relayList();
  if (!urls.length) throw Object.assign(new Error('Aucun relais configuré (Réglages → Relais).'), { unreachable: true });
  const keys = { ...s.keys }, b = body ? { ...body, keys: { gemini2: s.keys.gemini2 } } : null;
  let last;
  for (const u of urls) {
    try { return await relayOne(u, action, params, b, keys); }
    catch (e) { last = e; if (!e.unreachable) throw e; } // bascule sur le relais suivant seulement si injoignable / non-JSON
  }
  throw last;
}

/* ---- disjoncteur + santé + quotas (persistés) ---- */
const RSS_NAMES = ['Fed', 'BCE', 'BoE', 'BoJ', 'FXStreet'];
const Health = {
  all() { return store.get('health', {}); },
  get(n) { const h = this.all(); const x = h[n] || { fails: 0, until: 0, quotaDay: null, lastOk: null, lastErr: null, req: {} }; return x; },
  put(n, x) { const h = this.all(); h[n] = x; store.set('health', h); },
  blocked(n) { const x = this.get(n); return x.quotaDay === utcDay() ? 'quota épuisé' : x.until > Date.now() ? 'en pause jusqu\'à ' + new Date(x.until).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : null; },
  ok(n) { const x = this.get(n); x.fails = 0; x.until = 0; x.lastOk = new Date().toISOString(); this.put(n, x); },
  fail(n, msg, quota) { const x = this.get(n); x.lastErr = { msg, at: new Date().toISOString() }; if (quota) x.quotaDay = utcDay(); else if (++x.fails >= 2) x.until = Date.now() + (RSS_NAMES.includes(n) ? 5 : 10) * 6e4; this.put(n, x); },
  bump(n) { const x = this.get(n), d = utcDay(); x.req = x.req || {}; x.req[d] = (x.req[d] || 0) + 1; Object.keys(x.req).filter(k => k !== d).forEach(k => delete x.req[k]); this.put(n, x); },
  today(n) { return (this.get(n).req || {})[utcDay()] || 0; },
  reset(n) { const h = this.all(); if (h[n]) { h[n].fails = 0; h[n].until = 0; h[n].quotaDay = null; store.set('health', h); } },
  state(n) { const b = this.blocked(n), x = this.get(n); return b ? b : x.fails ? 'dégradé' : x.lastOk ? 'OK' : 'non testé'; }
};
const DAILY_LIMIT = { twelvedata: 800, alphavantage: 25, finnhub: 3600 };
function absorbAttempts(resp) { // met à jour santé/quotas à partir des tentatives renvoyées par le relais
  (resp?.attempts || []).forEach(a => { if (a.error === 'clé absente') return; Health.bump(a.source.split('_')[0]); Health.fail(a.source.split('_')[0], a.error, a.quota); });
  if (resp?.source) { const n = resp.source.split(/[_ ]/)[0]; Health.bump(n); Health.ok(n); }
}

/* ---- validation côté client (même règles que le relais) ---- */
function validateCandles(c) {
  if (!Array.isArray(c) || c.length < 100) throw new Error('moins de 100 bougies');
  c.forEach((b, i) => {
    if (![b.open, b.high, b.low, b.close].every(v => Number.isFinite(v) && v > 0)) throw new Error('prix invalide');
    if (i && !(b.date > c[i - 1].date)) throw new Error('dates non croissantes');
    if (i && Math.abs(b.close / c[i - 1].close - 1) > 0.08) throw new Error('variation aberrante');
  });
  return c;
}
const withMeta = (d, stale) => ({ ...d, stale: !!stale, age_minutes: ageMin(d.fetched_at) });

/* ---- historique : relais → Frankfurter direct → cache périmé (7 j) → N/A ---- */
async function fetchHistory(sym, { force = false } = {}) {
  const ck = 'hist_' + sym, cached = store.get(ck, null), TTL = 12 * 6e4 * 60;
  if (cached && !force && Date.now() - Date.parse(cached.fetched_at) < TTL) return withMeta(cached, false);
  const s = getSettings(), off = new Set([...(s.disabled.history || []), ...s.order.history.filter(n => Health.blocked(n))]);
  let order = s.order.history.filter(n => !off.has(n));
  if (s.primary === 'twelvedata') order = ['twelvedata', ...order.filter(n => n !== 'twelvedata')];
  if (s.primary === 'alphavantage') order = ['alphavantage', ...order.filter(n => n !== 'alphavantage')];
  const errs = [];
  try {
    const r = await relay('history', { symbol: sym, order: order.join(','), ...(new URLSearchParams(location.search).get('debug_fail') ? { debug_fail: new URLSearchParams(location.search).get('debug_fail') } : {}) });
    absorbAttempts(r); validateCandles(r.candles); store.set(ck, r); return withMeta(r, false);
  } catch (e) { absorbAttempts(e); errs.push('relais : ' + e.message); }
  if (!sym.includes('XAU') && !Health.blocked('frankfurter')) { // secours navigateur : Frankfurter autorise le CORS
    try {
      const [f, t] = sym.split('/'), start = new Date(Date.now() - 190 * 864e5).toISOString().slice(0, 10);
      const j = await (await fetch(`https://api.frankfurter.app/${start}..?from=${f}&to=${t}`)).json();
      const c = Object.keys(j.rates).sort().map(d => { const p = j.rates[d][t]; return { date: d, open: p, high: p, low: p, close: p }; });
      validateCandles(c); Health.ok('frankfurter');
      const r = { symbol: sym, candles: c, source: 'frankfurter (direct navigateur)', fetched_at: new Date().toISOString() }; store.set(ck, r); return withMeta(r, false);
    } catch (e) { Health.fail('frankfurter', e.message); errs.push('frankfurter direct : ' + e.message); }
  }
  if (cached && Date.now() - Date.parse(cached.fetched_at) < 7 * 864e5) return withMeta(cached, true);
  throw Object.assign(new Error('N/A : ' + errs.join(' ; ')), { na: true });
}

/* ---- prix instantané : relais → dernière clôture → N/A ---- */
async function fetchQuote(sym, hist, { force = false } = {}) {
  const ck = 'quote_' + sym, c = store.get(ck, null);
  if (c && !force && Date.now() - Date.parse(c.fetched_at) < 5 * 6e4) return withMeta(c, false);
  try {
    const r = await relay('quotes', { symbols: sym }), q = r.quotes?.[0];
    if (q && q.price > 0) { const d = { price: q.price, datetime: q.datetime, source: q.source, fetched_at: new Date().toISOString(), close_only: false }; store.set(ck, d); Health.bump(q.source); return withMeta(d, false); }
  } catch (e) { /* on passe à la dernière clôture */ }
  const last = hist?.candles?.[hist.candles.length - 1];
  if (last) return { price: last.close, datetime: last.date, source: 'clôture, pas instantané', fetched_at: hist.fetched_at, close_only: true, stale: hist.stale, age_minutes: ageMin(hist.fetched_at) };
  return { price: null, na: 'aucune donnée de prix' };
}

/* ---- calendrier : relais → cache périmé (7 j, passés grisés) → indisponible / démo explicite ---- */
async function fetchCalendar({ force = false } = {}) {
  const c = store.get('calendar', null);
  if (c && !force && Date.now() - Date.parse(c.fetched_at) < 5 * 6e4) return withMeta(c, false);
  try { const r = await relay('calendar'); absorbAttempts(r); store.set('calendar', r); return withMeta(r, false); }
  catch (e) { absorbAttempts(e); }
  if (c && Date.now() - Date.parse(c.fetched_at) < 7 * 864e5) return withMeta(c, true);
  if (getSettings().demo) return { events: DEMO_EVENTS(), source: 'DÉMO', fetched_at: new Date().toISOString(), stale: false, age_minutes: 0, demo: true };
  const manual = store.get('calendar_manual', []);
  return { events: manual, source: manual.length ? 'saisie manuelle' : 'indisponible', fetched_at: new Date().toISOString(), stale: false, age_minutes: 0, na: manual.length ? null : 'calendrier indisponible (saisie manuelle possible)' };
}
const DEMO_EVENTS = () => [{ id: 'demo1', title: 'Événement de démonstration', currency: 'USD', impact: 'fort', time: new Date(Date.now() + 864e5).toISOString(), forecast: null, previous: null, actual: null }];

/* ---- news : relais → cache (72 h, périmé) → aucune news ---- */
async function fetchNews({ force = false } = {}) {
  const c = store.get('news', null);
  if (c && !force && Date.now() - Date.parse(c.fetched_at) < 10 * 6e4) return withMeta(c, false);
  try {
    const s = getSettings(), av = s.avNews && Health.today('alphavantage') < 0.8 * DAILY_LIMIT.alphavantage;
    const r = await relay('news', av ? { av_news: '1' } : {}); store.set('news', r); return withMeta(r, false);
  } catch (e) {
    if (c && Date.now() - Date.parse(c.fetched_at) < 72 * 36e5) return withMeta(c, true);
    return { news: [], sources_status: {}, fetched_at: new Date().toISOString(), stale: false, age_minutes: 0, na: 'aucune news : ' + e.message };
  }
}

/* ---- badges de source ---- */
function badge(d) {
  if (!d || d.na) return `<span class="badge na">N/A (${esc(d?.na || 'donnée absente')})</span>`;
  if (d.stale) return `<span class="badge stale">périmé (il y a ${ageTxt(d.age_minutes)}) · ${esc(d.source)}</span>`;
  return `<span class="badge">${esc(d.source)}</span>`;
}

/* ---- onglets + registre de rendu (rempli par les parties 2-4) ---- */
const RENDER = {}; let currentTab = 'dashboard';
function showTab(t) { currentTab = t; $$('.tab').forEach(s => s.classList.toggle('on', s.id === 'tab-' + t)); $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t)); (RENDER[t] || (() => { }))(); }
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (b) showTab(b.dataset.tab); });
/* ================= FIN PARTIE 1/4 — la suite du <script> arrive en partie 2/4 ================= */
/* ================= PARTIE 2/4 : MOTEUR DE SCORING (déterministe, sans DOM) ================= */
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const normalize = (x, scale) => (x == null || !isFinite(x)) ? null : clamp(x / scale * 100, -100, 100);
const avg = a => { a = a.filter(v => v != null && isFinite(v)); return a.length ? a.reduce((s, v) => s + v, 0) / a.length : null; };
function SMA(v, n) { if (v.length < n) return null; let s = 0; for (let i = v.length - n; i < v.length; i++) s += v[i]; return s / n; }
function smaSeries(v, n) { const o = []; let s = 0; for (let i = 0; i < v.length; i++) { s += v[i]; if (i >= n) s -= v[i - n]; o.push(i >= n - 1 ? s / n : null); } return o; }
function RSI(v, n = 14) { // Wilder
  if (v.length < n + 1) return null; let g = 0, l = 0;
  for (let i = 1; i <= n; i++) { const d = v[i] - v[i - 1]; d >= 0 ? g += d : l -= d; } g /= n; l /= n;
  for (let i = n + 1; i < v.length; i++) { const d = v[i] - v[i - 1]; g = (g * (n - 1) + Math.max(d, 0)) / n; l = (l * (n - 1) + Math.max(-d, 0)) / n; }
  return l === 0 ? (g === 0 ? 50 : 100) : 100 - 100 / (1 + g / l);
}
function ATR(c, n = 14) { // Wilder
  if (c.length < n + 1) return null;
  const tr = i => Math.max(c[i].high - c[i].low, Math.abs(c[i].high - c[i - 1].close), Math.abs(c[i].low - c[i - 1].close));
  let a = 0; for (let i = 1; i <= n; i++) a += tr(i); a /= n;
  for (let i = n + 1; i < c.length; i++) a = (a * (n - 1) + tr(i)) / n;
  return a;
}
const retN = (v, n) => v.length > n ? v[v.length - 1] / v[v.length - 1 - n] - 1 : null;
const parsePair = s => s.split('/');
const comp = (key, value, raw, source, reason) => ({ key, value: value == null ? null : clamp(value, -100, 100), raw: raw ?? null, source: source || null, reason: value == null ? (reason || 'donnée absente') : null, contribution: 0 });

/* ---- 1. politique monétaire : rates[cur] = {policy, y2, policyPrev, y2Prev, date} (saisie manuelle) ---- */
function policyComponent(sym, rates) {
  const [b, q] = parsePair(sym), old = [];
  const get = cur => {
    const r = rates?.[cur]; if (!r || (toNum(r.policy) == null && toNum(r.y2) == null)) return { err: `taux ${cur} non saisis` };
    const age = r.date ? (Date.now() - Date.parse(r.date)) / 864e5 : null;
    if (age == null) return { err: `date des taux ${cur} manquante` };
    if (age > 120) return { err: `taux ${cur} trop anciens (${Math.round(age)} j)` };
    if (age > 45) old.push(cur);

/* ---- 2. momentum ---- */
function momentumComponent(sym, candles) {
  const cl = candles.map(c => c.close), p = cl[cl.length - 1], sc = sym.startsWith('XAU') ? 2 : 1;
  const s20 = SMA(cl, 20), s50 = SMA(cl, 50), s100 = SMA(cl, 100), s50b = cl.length >= 60 ? SMA(cl.slice(0, -10), 50) : null, rsi = RSI(cl, 14), r1 = retN(cl, 21), r3 = retN(cl, 63);

/* ---- 3. structure et volatilité ---- */

  return { c: comp('structure', v, `ATR14 ${(rel * 100).toFixed(2)} % du prix ; ${last.close > hi ? 'cassure du plus haut 20 j' : last.close < lo ? 'cassure du plus bas 20 j' : 'dans le range 20 j'}${noDirection ? ' ; marché sans direction' : ''}`), atr, noDirection };

/* ---- 4. appétit pour le risque (proxy = moyenne des rendements AUD/USD, NZD/USD, USD/JPY chargés, hors la paire) ---- */

function riskComponent(sym, candles, allHist) {

  const src = ['AUD/USD', 'NZD/USD', 'USD/JPY'].filter(s => s !== sym && allHist[s]?.candles?.length >= 60);
  if (src.length < 2) return comp('risk', null, null, null, 'proxy de risque indisponible (moins de 2 paires chargées)');
  const maps = src.map(s => { const m = {}, c = allHist[s].candles; for (let i = 1; i < c.length; i++) m[c[i].date] = c[i].close / c[i - 1].close - 1; return m; });
  const own = {}; for (let i = 1; i < candles.length; i++) own[candles[i].date] = candles[i].close / candles[i - 1].close - 1;
  const xs = [], ys = [];
  Object.keys(own).sort().slice(-60).forEach(d => { if (maps.every(m => m[d] != null)) { xs.push(own[d]); ys.push(avg(maps.map(m => m[d]))); } });
  if (xs.length < 30) return comp('risk', null, null, null, 'dates communes insuffisantes');

}

/* ---- 5. flux d'actualité (48 h, demi-vie 12 h) ---- */
const DIRV = { haussier: 1, baissier: -1, neutre: 0 };
function newsCurrencyScore(news, cur, now) {

    const imp = it.sentiment?.currency_impacts?.find(x => x.currency === cur); if (!imp || !(imp.force > 0)) continue;
    const w = (DIRV[imp.direction] || 0) * imp.force * Math.pow(0.5, ageH / 12); s += w; n++; items.push({ id: it.id, title: it.title, source: it.source, w });

}
function newsComponent(sym, news, now) {
  const [b, q] = parsePair(sym), A = newsCurrencyScore(news, b, now), B = newsCurrencyScore(news, q, now);
  if (A.n < 3 || B.n < 3) return { c: comp('news', null, null, null, `peu de news (${b} : ${A.n}, ${q} : ${B.n})`), items: [...A.items, ...B.items] };
  return { c: comp('news', normalize(A.s - B.s, 6), `${b} ${A.s.toFixed(2)} − ${q} ${B.s.toFixed(2)} (${A.n}+${B.n} news)`, news.some(n => n.sentiment?.heuristic) ? 'Gemini/heuristique' : 'Gemini'), items: [...A.items, ...B.items] };
}

/* ---- risque événementiel : réduit la CONVICTION, jamais le sens ---- */
function eventRisk(sym, events, news, now) {
  const cur = parsePair(sym), risks = []; let pen = 0;
  (events || []).filter(e => e.impact === 'fort' && cur.includes(e.currency) && Date.parse(e.time) > now && Date.parse(e.time) < now + 48 * 36e5).slice(0, 3).forEach(e => { pen += 8; risks.push(`Événement fort : ${e.currency} ${e.title} (${fmtTime(e.time)})`); });
  news.filter(n => now - Date.parse(n.published_at) < 24 * 36e5 && n.sentiment?.currency_impacts?.some(i => cur.includes(i.currency) && i.force >= 3) && ['banque_centrale', 'geopolitique'].includes(n.sentiment.categorie)).slice(0, 2).forEach(n => { pen += 10; risks.push(`Titre de force 3 : ${n.title}`); });
  return { penalty: Math.min(pen, 30), risks };
}

/* ---- fiabilité des données ---- */
function reliability(hist, comps) {

  if (/frankfurter|stooq/.test(hist.source) || hist.age_minutes > 1440 || missing >= 2) return { label: 'moyenne', q: 0.7 };

}
const biasOf = s => s >= 20 ? 'Haussier' : s <= -20 ? 'Baissier' : 'Neutre';

/* ---- score d'une paire ---- */
function computePair(sym, hist, ctx) {

  const [b, q] = parsePair(sym), cdl = hist.candles, stale24 = hist.stale && hist.age_minutes > 1440, price = cdl[cdl.length - 1].close;
  const str = structureComponent(cdl), nw = newsComponent(sym, ctx.news || [], now);

  const comps = [policyComponent(sym, ctx.settings.rates), market(momentumComponent(sym, cdl)), market(str.c), market(riskComponent(sym, cdl, ctx.allHist || {})), nw.c];
  const keys = ['policy', 'momentum', 'structure', 'risk', 'news'];

  if (!tot) return { sym, excluded: 'aucun composant calculable : ' + comps.map(c => c.key + ' (' + c.reason + ')').join(' ; ') };

}

/* ---- Edge global, régime macro (règles) ---- */

  const w = r.reduce((a, x) => a + x.quality, 0); return Math.round(r.reduce((a, x) => a + x.conviction * x.quality, 0) / w);
}

/* ---- chargement séquentiel, budget de quota, pause par minute ---- */
const CALLS = {}, PERMIN = { alphavantage: 5, twelvedata: 8 };
async function minuteGate(src) {
  const p = String(src).split(/[ _]/)[0]; if (!PERMIN[p]) return; const now = Date.now();
  CALLS[p] = (CALLS[p] || []).filter(t => now - t < 6e4); CALLS[p].push(now);
  if (CALLS[p].length >= PERMIN[p]) { setProg('Pause de 13 s (quota par minute)…'); await sleep(13000); }
}
async function loadAll(force) {

  try {
    const s = getSettings(); let pairs = activePairs();
    const fresh = p => { const c = store.get('hist_' + p, null); return c && Date.now() - Date.parse(c.fetched_at) < 432e5; };
    const need = pairs.filter(p => force || !fresh(p));
    const keyed = ['twelvedata', 'alphavantage'].filter(n => s.keys[n] && !Health.blocked(n));
    const rem = keyed.length ? Math.max(...keyed.map(n => DAILY_LIMIT[n] - Health.today(n))) : Infinity;
    let msg = `Coût estimé : ${need.length} requête(s) d'historique` + (rem === Infinity ? ' (sources sans clé : pas de quota)' : ` ; quota restant aujourd'hui : ${Math.max(rem, 0)}`) + '.';
    if (rem !== Infinity && need.length > rem) {
      const skipped = need.slice(Math.max(rem, 0)); pairs = pairs.filter(p => !skipped.includes(p) || store.get('hist_' + p, null));
      msg += ` Quota insuffisant : seules les paires prioritaires sont rechargées ; ${skipped.join(', ')} restent sur cache ou N/A.`;
      toast(msg, 9000);
    }
    if (force && need.length && !(await askModal(`<p>${esc(msg)}</p>`))) return;
    setProg(msg, 0); const doQuotes = keyed.length > 0 && rem >= need.length + pairs.length;
    APP.histErr = {};
    for (let i = 0; i < pairs.length; i++) {
      const p = pairs[i]; setProg(`${i + 1}/${pairs.length} paires — ${p}`, Math.round(i / pairs.length * 100));
      try {
        const h = await fetchHistory(p, { force }); APP.hist[p] = h;
        if (!h.stale && Date.now() - Date.parse(h.fetched_at) < 15000) await minuteGate(h.source);
        APP.quote[p] = doQuotes ? await fetchQuote(p, h, { force }) : await fetchQuote(p, h, { force: false }).catch(() => null);
        if (!doQuotes) { const l = h.candles[h.candles.length - 1]; APP.quote[p] = { price: l.close, datetime: l.date, source: 'clôture, pas instantané', stale: h.stale, age_minutes: h.age_minutes, close_only: true }; }

  } catch (e) { toast('Chargement : ' + e.message); }
  finally { APP.busy = false; showTab(currentTab); }
}

/* ---- sentiment : Gemini (1 appel groupé, cache 30 min) → mots-clés (heuristique) → aucun ---- */
const HEUR = [[/hike|hawkish|raises? rates?|higher|strong|surge|rally|beat|jumps?/i, 1], [/cuts?|dovish|lower|weak|slump|falls?|drops?|miss|recession|plunge/i, -1]];

  const dir = d > 0 ? 'haussier' : d < 0 ? 'baissier' : 'neutre';
  return { currency_impacts: cur.map(c => ({ currency: c, direction: dir, force: d ? 1 : 0 })), categorie: /inflation|cpi|pce/i.test(n.title) ? 'inflation' : /jobs|payroll|employment/i.test(n.title) ? 'emploi' : n.impact_hint === 'banque centrale' ? 'banque_centrale' : 'autre', heuristic: true };
}

  const failAt = store.get('sent_fail', 0);
  if (todo.length && now - failAt > 6e5 && relayList().length) {
    try {
      const prompt = 'Titres numérotés :\n' + todo.map((n, i) => `${i + 1}. ${n.title}`).join('\n') + '\nRenvoie {"items":[{"n":1,"currency_impacts":[{"currency":"USD","direction":"haussier|baissier|neutre","force":0-3}],"categorie":"' + CATS.join('|') + '"}]}';
      const r = await relay('chat', {}, { system: 'Analyste macro. Base-toi UNIQUEMENT sur le titre. Réponds « neutre » (force 0) si rien ne permet de conclure. Devises possibles : USD EUR GBP JPY CHF AUD CAD NZD XAU WTI. JSON strict, sans texte autour.', prompt, model: getSettings().model });
      (r.parsed?.items || []).forEach(it => { const n = todo[it.n - 1]; if (n && Array.isArray(it.currency_impacts)) cache[n.id] = { at: now, v: { currency_impacts: it.currency_impacts.filter(x => x && x.currency && DIRV[x.direction] !== undefined).map(x => ({ currency: x.currency, direction: x.direction, force: clamp(+x.force || 0, 0, 3) })), categorie: CATS.includes(it.categorie) ? it.categorie : 'autre' } }; });
    } catch (e) { store.set('sent_fail', now); }

}

/* ---- graphiques SVG ---- */
function spark(c, n = 60) {

  const pts = v.map((y, i) => `${(i / (v.length - 1) * w).toFixed(1)},${(h - (y - mn) / (mx - mn || 1) * h).toFixed(1)}`).join(' ');
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${v[v.length - 1] >= v[0] ? 'var(--up)' : 'var(--dn)'}" stroke-width="1.5"/></svg>`;
}
function priceChart(c, levels) {
  const n = Math.min(100, c.length), cl = c.map(x => x.close), ser = [[20, '#f0a030'], [50, '#4f8cff'], [100, '#b56cff']].map(([k, col]) => [k, col, smaSeries(cl, k).slice(-n)]);
  const v = cl.slice(-n), all = v.concat(...ser.map(s => s[2].filter(x => x != null)), levels?.supports || [], levels?.resistances || []), mn = Math.min(...all), mx = Math.max(...all), W = 700, H = 240;
  const X = i => i / (n - 1) * W, Y = y => H - (y - mn) / (mx - mn || 1) * (H - 10) - 5, line = (a, col, sw) => { const pts = a.map((y, i) => y == null ? null : `${X(i).toFixed(1)},${Y(y).toFixed(1)}`).filter(Boolean).join(' '); return `<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="${sw}"/>`; };
  const lv = [...(levels?.supports || []).map(y => [y, 'var(--up)']), ...(levels?.resistances || []).map(y => [y, 'var(--dn)'])].map(([y, col]) => `<line x1="0" x2="${W}" y1="${Y(y)}" y2="${Y(y)}" stroke="${col}" stroke-dasharray="4 4" opacity=".6"/>`).join('');
  return `<div class="scroll"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:420px;height:auto">${lv}${line(v, 'var(--tx)', 1.6)}${ser.map(s => line(s[2], s[1], 1.2)).join('')}</svg></div><div class="mu" style="font-size:12px">Prix · <span style="color:#f0a030">MM20</span> · <span style="color:#4f8cff">MM50</span> · <span style="color:#b56cff">MM100</span> · pointillés : supports (vert) / résistances (rouge)</div>`;
}

    label = 'Automatique, sans IA (Gemini indisponible : ' + e.message + ')';
  }
  $('#genOut').innerHTML = `<div class="warn">${esc(label)}</div><div class="card"><b>Synthèse</b><p>${esc(txt(out.synthese))}</p></div><div class="grid">${(out.paires || []).map(p => `<div class="card"><b>${esc(txt(p.paire))}</b> — ${esc(txt(p.biais))}<p>${esc(txt(p.idee))}</p><p class="mu">Supports : ${esc(txt(p.niveaux?.supports))}<br>Résistances : ${esc(txt(p.niveaux?.resistances))}</p><ul>${(p.risques || []).map(x => `<li>${esc(txt(x))}</li>`).join('')}</ul></div>`).join('')}</div><div class="warn">Aide à l'analyse, pas un conseil en investissement. Les scores sont un modèle heuristique.</div>`;
  $('#gStatus').textContent = '';
};

/* ---- Journal ---- */
const JCOLS = ['date', 'actif', 'sens', 'entree', 'sortie', 'statut', 'pnl', 'these'];
function jStats(j) {
  const c = j.filter(x => x.pnl != null), w = c.filter(x => x.pnl > 0).length, sum = c.reduce((a, x) => a + x.pnl, 0);
  return { n: j.length, closed: c.length, rate: c.length ? Math.round(w / c.length * 100) : null, sum, mean: c.length ? sum / c.length : null };
}
const fr = n => n == null ? '—' : String(+n.toFixed(4)).replace('.', ',');
function renderJournal() {
  const j = store.get('journal', []), st = jStats(j);
  $('#journalView').innerHTML = `<div class="card"><b>Stats</b> : ${st.n} entrée(s) · taux de réussite ${st.rate == null ? 'N/A' : st.rate + ' %'} · PnL cumulé ${fr(st.sum)} % · PnL moyen ${fr(st.mean)} %</div>
  <div class="card"><b>Nouvelle entrée</b><div class="grid">
   <input id="j-date" type="date" value="${utcDay()}"><input id="j-asset" placeholder="Actif (EUR/USD)" list="pl"><datalist id="pl">${PAIRS.map(p => `<option>${p}</option>`).join('')}</datalist>
   <select id="j-side"><option>Achat</option><option>Vente</option><option>Neutre</option></select><input id="j-entry" placeholder="Entrée (1,0850)"><input id="j-exit" placeholder="Sortie">
   <select id="j-status"><option>idée</option><option>ouvert</option><option>clôturé</option></select><input id="j-pnl" placeholder="PnL % (ex. -0,8)"><input id="j-thesis" placeholder="Thèse"></div>
   <button class="btn pri" data-act="jadd">Ajouter</button> <button class="btn" data-act="jexport">Export CSV</button> <label class="btn">Import CSV<input type="file" id="jfile" accept=".csv,text/csv" hidden></label></div>
  <div class="card scroll"><table class="tbl"><tr><th>Date</th><th>Actif</th><th>Sens</th><th>Entrée</th><th>Sortie</th><th>Statut</th><th>PnL %</th><th>Thèse</th><th></th></tr>
  ${j.map((x, i) => `<tr><td>${esc(x.date)}</td><td>${esc(x.asset)}</td><td>${esc(x.side)}</td><td>${fr(x.entry)}</td><td>${fr(x.exit)}</td><td>${esc(x.status)}</td><td class="${cls(x.pnl)}">${fr(x.pnl)}</td><td style="white-space:normal;max-width:320px">${esc(x.thesis)}</td><td><button class="btn" data-act="jdel" data-i="${i}">✕</button></td></tr>`).join('')}</table></div>`;
  $('#jfile').onchange = e => importCSV(e.target.files[0]);
}
RENDER.journal = renderJournal;
ACT.jadd = () => {
  const j = store.get('journal', []), asset = $('#j-asset').value.trim(); if (!asset) return toast('Indique l\'actif.');
  j.push({ id: Date.now(), date: $('#j-date').value || utcDay(), asset, side: $('#j-side').value, entry: toNum($('#j-entry').value), exit: toNum($('#j-exit').value), status: $('#j-status').value, pnl: toNum($('#j-pnl').value), thesis: $('#j-thesis').value.trim() });
  store.set('journal', j); renderJournal();
};
ACT.jdel = t => { const j = store.get('journal', []); j.splice(+t.dataset.i, 1); store.set('journal', j); renderJournal(); };
const csvCell = v => { let s = v == null ? '' : typeof v === 'number' ? String(v).replace('.', ',') : String(v); if (/^[=+\-@]/.test(s) && typeof v === 'string') s = "'" + s; return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
ACT.jexport = () => {
  const j = store.get('journal', []), csv = '\ufeff' + JCOLS.join(';') + '\n' + j.map(x => [x.date, x.asset, x.side, x.entry, x.exit, x.status, x.pnl, x.thesis].map(csvCell).join(';')).join('\n');
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = 'journal-macroedge.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
  catch { copyText(csv); }
};
function parseCSV(t) {
  t = t.replace(/^\ufeff/, ''); const d = (t.split('\n')[0].match(/;/g) || []).length ? ';' : ','; const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < t.length; i++) { const c = t[i];
    if (q) { if (c === '"' && t[i + 1] === '"') { cur += '"'; i++; } else if (c === '"') q = false; else cur += c; }
    else if (c === '"') q = true; else if (c === d) { row.push(cur); cur = ''; } else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; row.push(cur); cur = ''; if (row.some(x => x)) rows.push(row); row = []; } else cur += c; }
  row.push(cur); if (row.some(x => x)) rows.push(row); return rows;
}
async function importCSV(f) {
  if (!f) return; const rows = parseCSV(await f.text()), h = rows.shift().map(x => x.trim().toLowerCase()); const ix = k => h.indexOf(k);
  if (ix('actif') < 0) return toast('CSV non reconnu : colonne « actif » absente.');
  const j = store.get('journal', []); rows.forEach(r => j.push({ id: Date.now() + Math.random(), date: r[ix('date')] || utcDay(), asset: r[ix('actif')], side: r[ix('sens')] || 'Neutre', entry: toNum(r[ix('entree')]), exit: toNum(r[ix('sortie')]), status: r[ix('statut')] || 'idée', pnl: toNum(r[ix('pnl')]), thesis: (r[ix('these')] || '').replace(/^'/, '') }));
  store.set('journal', j); toast(rows.length + ' ligne(s) importée(s).'); renderJournal();
}

/* ---- Réglages ---- */
const CURS = ['USD', 'EUR', 'GBP', 'JPY', 'CHF', 'AUD', 'CAD', 'NZD'], PROV = ['twelvedata', 'alphavantage', 'frankfurter', 'stooq', 'finnhub', 'forexfactory', 'gemini', ...RSS_NAMES];
function saveFromForm() {
  if (!$('#k-gemini')) return getSettings(); const s = getSettings();
  ['gemini', 'gemini2', 'twelvedata', 'alphavantage', 'finnhub'].forEach(k => s.keys[k] = $('#k-' + k).value.trim());
  s.model = $('#s-model').value.trim() || DEFAULTS.model; s.relays = $('#s-relays').value.split('\n').map(x => x.trim()).filter(Boolean); s.primary = $('#s-primary').value;
  PAIRS.forEach(p => s.active[p] = $('#a-' + p.replace('/', '')).checked); Object.keys(s.weights).forEach(k => s.weights[k] = toNum($('#w-' + k).value) ?? 0);
  s.demo = $('#s-demo').checked; s.avNews = $('#s-avnews').checked; s.disabled.history = s.order.history.filter(n => !$('#o-' + n).checked);
  CURS.forEach(c => { const g = f => toNum($(`#r-${c}-${f}`).value), r = { policy: g('policy'), y2: g('y2'), policyPrev: g('policyPrev'), y2Prev: g('y2Prev'), date: $(`#r-${c}-date`).value }; if (r.policy != null || r.y2 != null) s.rates[c] = r; else delete s.rates[c]; });
  saveSettings(s); return s;
}
function renderSettings() {
  const s = getSettings(), sum = Object.values(s.weights).reduce((a, b) => a + (+b || 0), 0);
  const ph = PROV.map(n => { const x = Health.get(n), st = Health.state(n); return `<tr><td>${esc(n)}</td><td class="${st === 'OK' ? 'up' : st === 'dégradé' || st === 'non testé' ? 'mu' : 'dn'}">${esc(st)}</td><td>${x.lastOk ? fmtTime(x.lastOk) : '—'}</td><td style="white-space:normal">${x.lastErr ? esc(x.lastErr.msg) + ' (' + fmtTime(x.lastErr.at) + ')' : '—'}</td><td>${Health.today(n)}${DAILY_LIMIT[n] ? ' / ' + DAILY_LIMIT[n] : ''}</td></tr>`; }).join('');
  $('#settingsView').innerHTML = `
  <div class="card"><b>Clés API</b> <span class="mu">(stockées dans ce navigateur, envoyées au relais, jamais loguées)</span><div class="grid">
   ${[['gemini', 'Gemini'], ['gemini2', 'Gemini (2ᵉ clé, secours)'], ['twelvedata', 'Twelve Data'], ['alphavantage', 'Alpha Vantage'], ['finnhub', 'Finnhub']].map(([k, l]) => `<label>${l}<br><input type="password" id="k-${k}" autocomplete="off" value="${esc(s.keys[k])}" style="width:100%"></label>`).join('')}
   <label>Modèle Gemini<br><input id="s-model" value="${esc(s.model)}" style="width:100%"></label></div></div>
  <div class="card"><b>Relais</b> (une URL par ligne ; principal puis secours)<br><textarea id="s-relays" rows="3" style="width:100%">${esc(s.relays.join('\n') || (relayList()[0] || ''))}</textarea>
   <label>Source principale <select id="s-primary">${[['auto', 'Auto'], ['twelvedata', 'Twelve Data'], ['alphavantage', 'Alpha Vantage']].map(([v, l]) => `<option value="${v}" ${s.primary === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
   <p><b>Ordre de la chaîne « historique »</b> (désactive un fournisseur en le décochant)</p>${s.order.history.map((n, i) => `<div><input type="checkbox" id="o-${n}" ${(s.disabled.history || []).includes(n) ? '' : 'checked'}> ${esc(n)} <button class="btn" data-act="ord" data-i="${i}" data-d="-1">↑</button><button class="btn" data-act="ord" data-i="${i}" data-d="1">↓</button></div>`).join('')}
   <p class="mu" style="font-size:12px">Les chaînes calendrier et news suivent l'ordre fixe du relais (Finnhub → ForexFactory ; Finnhub → flux RSS → Alpha Vantage).</p>
   <label><input type="checkbox" id="s-avnews" ${s.avNews ? 'checked' : ''}> Alpha Vantage NEWS_SENTIMENT (1 appel, jamais au-delà de 80 % du quota)</label><br><label><input type="checkbox" id="s-demo" ${s.demo ? 'checked' : ''}> Mode démo (calendrier fictif, affiché « DÉMO »)</label></div>
  <div class="card"><b>Paires actives</b><br>${PAIRS.map(p => `<label style="margin-right:10px"><input type="checkbox" id="a-${p.replace('/', '')}" ${s.active[p] ? 'checked' : ''}> ${p}</label>`).join('')}
   <p><b>Poids du scoring</b> (somme ${sum} % ; renormalisés si un composant manque)</p>${[['policy', 'Politique monétaire'], ['momentum', 'Momentum'], ['structure', 'Structure'], ['risk', 'Risque'], ['news', 'News']].map(([k, l]) => `<label style="margin-right:10px">${l} <input id="w-${k}" value="${s.weights[k]}" size="3"></label>`).join('')}</div>
  <div class="card scroll"><b>Taux directeurs et rendements 2 ans</b> <span class="badge">manuel</span> <button class="btn" data-act="importUS">Importer les taux US (Alpha Vantage)</button>
   <table class="tbl"><tr><th>Devise</th><th>Taux dir. %</th><th>Rdt 2 ans %</th><th>Taux précédent</th><th>Rdt précédent</th><th>Date</th></tr>
   ${CURS.map(c => { const r = s.rates[c] || {}; return `<tr><td>${c}</td>${['policy', 'y2', 'policyPrev', 'y2Prev'].map(f => `<td><input id="r-${c}-${f}" value="${r[f] ?? ''}" size="6"></td>`).join('')}<td><input type="date" id="r-${c}-date" value="${esc(r.date || '')}"></td></tr>`; }).join('')}</table></div>
  <div class="card"><button class="btn pri" data-act="save">Enregistrer</button> <button class="btn" data-act="testGemini">Tester Gemini</button> <button class="btn" data-act="testData">Tester les données</button> <button class="btn" data-act="retest">Tout retester</button> <button class="btn" data-act="clear" style="border-color:var(--dn)">Effacer mes données</button><div id="testOut"></div></div>
  <div class="card scroll"><b>Santé des sources et quotas du jour</b><table class="tbl"><tr><th>Source</th><th>État</th><th>Dernier succès</th><th>Dernière erreur</th><th>Requêtes aujourd'hui</th></tr>${ph}</table></div>`;
}
RENDER.settings = renderSettings;
ACT.save = () => { saveFromForm(); toast('Réglages enregistrés.'); renderSettings(); };
ACT.ord = t => { const s = saveFromForm(), i = +t.dataset.i, j = i + +t.dataset.d; if (j < 0 || j >= s.order.history.length) return; [s.order.history[i], s.order.history[j]] = [s.order.history[j], s.order.history[i]]; saveSettings(s); renderSettings(); };
async function runTest(what) {
  saveFromForm(); $('#testOut').innerHTML = '<p class="mu">Test en cours…</p>';
  try {
    const r = await relay('test', { what }); const res = r.results || {};
    Object.entries(res).forEach(([n, v]) => { Health.reset(n); v.ok ? Health.ok(n) : Health.fail(n, v.error, /quota|429/i.test(v.error)); });
    $('#testOut').innerHTML = '<ul>' + Object.entries(res).map(([n, v]) => `<li class="${v.ok ? 'up' : 'dn'}">${esc(n)} : ${v.ok ? 'OK ' + esc(txt(v.detail)) : esc(v.error)} <span class="mu">(${v.ms} ms)</span></li>`).join('') + '</ul>';
  } catch (e) { $('#testOut').innerHTML = `<p class="dn">${esc(e.message)}</p>`; }
  renderSettingsKeepOut();
}
function renderSettingsKeepOut() { const o = $('#testOut').innerHTML; renderSettings(); $('#testOut').innerHTML = o; }
ACT.testGemini = () => runTest('gemini'); ACT.testData = async () => { await runTest('twelvedata'); const o = $('#testOut').innerHTML; await runTest('all'); $('#testOut').innerHTML = $('#testOut').innerHTML || o; }; ACT.retest = () => runTest('all');
ACT.importUS = async () => {
  saveFromForm(); try { const r = await relay('rates'); const s = getSettings(); s.rates.USD = r.USD; saveSettings(s); toast('Taux US importés (source : Alpha Vantage).'); renderSettings(); } catch (e) { toast('Import impossible : ' + e.message); }
};
ACT.clear = async () => { if (await askModal('<p>Effacer clés, réglages, caches, journal et analyses de ce navigateur ?</p>', 'Effacer')) { store.clearAll(); toast('Données effacées.'); applyTheme(); showTab('settings'); } };
RENDER.settings = renderSettings;

/* ---- démarrage ---- */
function boot() {
  applyTheme(); if (!store.get('settings', null)) { const s = getSettings(); if (relayList().length) s.relays = relayList(); saveSettings(s); }
  showTab('dashboard');
  if (relayList().length) loadAll(false); else { toast('Configure d\'abord l\'URL de ton relais (Réglages).', 8000); showTab('settings'); }
}
window.runSelfTests = runSelfTests; boot();
</script>
</body>
